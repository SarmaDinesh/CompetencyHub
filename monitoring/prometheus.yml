global:
  scrape_interval: 15s

scrape_configs:
  - job_name: competencyhub
    metrics_path: /actuator/prometheus
    static_configs:
      # app:8080                 -> the app running in compose (service name)
      # host.docker.internal:8080 -> the app running in IntelliJ on your PC
      # Whichever is not running shows as DOWN on the Targets page; that's expected.
      - targets: ["app:8080", "host.docker.internal:8080"]