# Everything here is a development convenience and must not reach production.

# See the SQL Hibernate runs, with bound parameters.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Query counts per transaction — how the N+1 work was measured.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# Exception messages in error responses. Off by default in Boot because it can
# leak internals to clients; invaluable while developing.
server.error.include-message=always

# Log every service call, not just slow ones.
competencyhub.audit.slow-call-threshold-ms=1
logging.level.com.example.CompetencyHub=DEBUG
