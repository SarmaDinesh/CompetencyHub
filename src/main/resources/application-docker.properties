# Inside the Docker network, Postgres answers to its service name, not localhost.
spring.datasource.url=jdbc:postgresql://postgres:5432/competencyhub

# Quieter logs, no SQL dumps.
logging.level.org.hibernate.SQL=INFO
server.error.include-message=never
competencyhub.audit.slow-call-threshold-ms=500

logging.structured.format.file=ecs
logging.structured.json.add.service=competencyhub
logging.structured.json.add.environment=docker

# JWT keys must be stable across restarts and shared by every instance: supply them.
# Generate once with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
#   openssl rsa -in jwt-private.pem -pubout -out jwt-public.pem
# and pass their locations as environment variables (relaxed binding maps them):
#   COMPETENCYHUB_SECURITY_JWT_PUBLICKEY=file:/run/secrets/jwt-public.pem
#   COMPETENCYHUB_SECURITY_JWT_PRIVATEKEY=file:/run/secrets/jwt-private.pem
