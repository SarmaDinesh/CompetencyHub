# =============================================================================
# Profile: docker -- the app running as a container.
# Everything here overrides application.properties. Anything else can be
# overridden at runtime with environment variables (SPRING_DATASOURCE_URL, ...)
# without rebuilding the image.
# =============================================================================

# --- Database ------------------------------------------------------------------
# Inside the Compose network, Postgres answers to its service name, not localhost.
spring.datasource.url=jdbc:postgresql://postgres:5432/competencyhub

# --- Logging: console only, as JSON ----------------------------------------------
# A container's filesystem is thrown away with the container, and the app runs
# as a non-root user that cannot create /app/logs anyway. Docker (and later
# CloudWatch) collect stdout, so that is where logs go.
# An empty value switches file logging off.
logging.file.name=
# One JSON object per line (Elastic Common Schema): log tools can search by field
# (level, logger, trace id) instead of grepping text.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=competencyhub
logging.structured.ecs.service.environment=docker

# --- Quieter than development -----------------------------------------------------
logging.level.com.example.CompetencyHub=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.stat=INFO
spring.jpa.properties.hibernate.generate_statistics=false

# --- Errors and auditing ----------------------------------------------------------
server.error.include-message=never
competencyhub.audit.slow-call-threshold-ms=500

# --- JWT signing keys ---------------------------------------------------------------
# Keys must be stable across restarts and shared by every instance: supply them.
# Generate once with:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt-private.pem
#   openssl rsa -in jwt-private.pem -pubout -out jwt-public.pem
# and pass their locations as environment variables (relaxed binding maps them):
#   COMPETENCYHUB_SECURITY_JWT_PUBLICKEY=file:/run/secrets/jwt-public.pem
#   COMPETENCYHUB_SECURITY_JWT_PRIVATEKEY=file:/run/secrets/jwt-private.pem
# Without them the app generates a temporary key pair and logs a WARN -- fine for
# a local compose stack, wrong for anything shared.