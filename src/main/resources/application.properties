spring.application.name=CompetencyHub
logging.level.root=ERROR
logging.level.org.springframework=ERROR

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/competencyhub
spring.datasource.username=chub
spring.datasource.password=chub

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Hibernate session statistics. Logs how many queries each transaction ran —
# this is the instrument that makes the N+1 problem measurable rather than theoretical.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# See the SQL Hibernate actually runs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Profile: enables the dev-only data seeder (see DevDataSeeder)
spring.profiles.active=dev

# Application settings (see AppProperties)
competencyhub.institution-name=CompetencyHub University
competencyhub.default-course-capacity=30
competencyhub.audit.enabled=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# The consumer group. Every consumer sharing this id splits the partitions between
# them — that is how Kafka scales out. Two apps with DIFFERENT group ids each get
# their own copy of every message instead.
spring.kafka.consumer.group-id=competencyhub-notifications

# A brand-new group with no committed offset starts at the beginning of the topic.
# "latest" would silently skip everything published before the consumer first ran.
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Security control: the JSON deserializer will only instantiate classes from these
# packages. Without it, a malicious message naming any class on the classpath could
# trigger deserialization of something dangerous.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.CompetencyHub.messaging.event

# --- Scheduled jobs -------------------------------------------------------
competencyhub.jobs.lock-key=811001
# Second Minute Hour DayOfMonth Month DayOfWeek -- six fields, no year.
competencyhub.jobs.progress-recalculation.cron=0 0 2 * * *
competencyhub.jobs.progress-recalculation.zone=America/Chicago
competencyhub.jobs.progress-recalculation.enabled=true
competencyhub.jobs.progress-recalculation.batch-size=200
competencyhub.jobs.progress-recalculation.max-runtime=5m

# --- Thread pools ---------------------------------------------------------
# The scheduler defaults to ONE thread. Two @Scheduled methods whose windows overlap would
# run one after the other, and a job that hangs would block every other job forever.
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduling-

# The default @Async executor, separate from the jobExecutor bean.
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=async-

logging.level.com.example.CompetencyHub.jobs=DEBUG
