# =============================================================================
# Production profile -- activated by SPRING_PROFILES_ACTIVE=prod (docker-compose.prod.yml).
# Only what DIFFERS from application.properties lives here.
# Secrets use ${VAR} with NO default: a missing one stops startup instead of silently
# falling back to a dev value.
# =============================================================================

# --- Database ------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://postgres:5432/competencyhub
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA: no dev instrumentation -----------------------------------------------
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.format_sql=false

# --- Logging: INFO, JSON to the console, nothing to disk -------------------------
logging.level.com.example.CompetencyHub=INFO
logging.level.com.example.CompetencyHub.jobs=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.stat=INFO
logging.file.name=
logging.structured.format.console=ecs
logging.structured.ecs.service.name=competencyhub
logging.structured.ecs.service.environment=prod

# --- Errors: never leak internals to clients ------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
competencyhub.audit.slow-call-threshold-ms=500

# --- Actuator: only what the health check and a visitor need ---------------------
# Everything else (loggers, mappings, prometheus...) now returns 404.
management.endpoints.web.exposure.include=health,info

# --- Behind a reverse proxy (Caddy, Step 5) ---------------------------------------
# Trust X-Forwarded-Proto/Host so Location headers and Swagger's server URL say https://.
server.forward-headers-strategy=framework

# --- JWT: stable keys from files mounted by docker-compose.prod.yml ----------------
# Tokens now survive restarts (dev generates a new key pair on every start).
competencyhub.security.jwt.public-key=file:/run/secrets/jwt-public.pem
competencyhub.security.jwt.private-key=file:/run/secrets/jwt-private.pem