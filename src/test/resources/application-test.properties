# Loaded on top of application.properties by tests annotated @ActiveProfiles("test").
#
# These lived in the main application.properties under a "Tests" heading, which meant they
# applied EVERYWHERE -- including `./mvnw spring-boot:run`. auto-startup=false there silently
# switched off every @KafkaListener in dev: enrollments published events that nothing
# consumed. Profile-specific files exist so that test conveniences cannot leak into the app.

# No broker in the test containers: do not start consumers...
spring.kafka.listener.auto-startup=false
# ...and do not try to create topics on a broker that is not there.
spring.kafka.admin.auto-create=false
